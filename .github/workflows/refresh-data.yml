name: Refresh stats data

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch pantry + model stats
        run: python scripts/fetch-data.py
      - name: Commit if changed
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add assets/data/rsi.csv assets/data/model_daily.csv assets/data/rsi_latest.csv
          git diff --cached --quiet && exit 0
          git commit -m "stats refresh $(date -u +%F-%H%M)"
          git pull --rebase -X theirs || true
          git push || (git pull --rebase -X theirs && git push)
